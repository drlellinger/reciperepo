name: Publish to GitHub Container Registry

on:
  push:
    # Löst nur aus, wenn du einen Tag im Format v1.0.0 pushst (z.B. beim Erstellen eines Releases)
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  # github.repository setzt automatisch deinen Benutzernamen und Reponamen ein (z.B. "dein-name/dein-repo")
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Für die Signierung mit Cosign (optional)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login bei GHCR über das automatische GitHub Token (kein separates Passwort nötig!)
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadata-Action generiert die Tags (z.B. v1.0.0 und latest)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=literal,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
