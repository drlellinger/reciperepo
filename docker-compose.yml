services:
  reciperepo:
    build: .
    env_file:
      - .env
    ports:
      - "${RECIPEREPO_PORT}:80"
    environment:
      # Required administration credentials.
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER muss in .env gesetzt sein}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD muss in .env gesetzt sein}
      # Public URL and branding. Paths are relative to /public in the image.
      RECIPEREPO_SITE_NAME: "${RECIPEREPO_SITE_NAME}"
      RECIPEREPO_LOGO_TEXT: "${RECIPEREPO_LOGO_TEXT}"
      RECIPEREPO_LOGO_IMAGE: "${RECIPEREPO_LOGO_IMAGE}"
      RECIPEREPO_LOGO_ALT: "${RECIPEREPO_LOGO_ALT}"
      RECIPEREPO_FAVICON: "${RECIPEREPO_FAVICON}"
      RECIPEREPO_APPLE_TOUCH_ICON: "${RECIPEREPO_APPLE_TOUCH_ICON}"
      RECIPEREPO_SITE_URL: "${RECIPEREPO_SITE_URL}"
      RECIPEREPO_FOOTER_NAME: "${RECIPEREPO_FOOTER_NAME}"
      RECIPEREPO_PRIVACY_URL: "${RECIPEREPO_PRIVACY_URL}"
      RECIPEREPO_IMPRINT_URL: "${RECIPEREPO_IMPRINT_URL}"
    volumes:
      - reciperepo-recipes:/var/www/html/recipes
      - reciperepo-images:/var/www/html/public/uploads/images
    restart: unless-stopped

volumes:
  reciperepo-recipes:
  reciperepo-images: